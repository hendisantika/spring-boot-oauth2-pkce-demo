name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push to the same branch makes the previous run's answer irrelevant, so it is cancelled
# rather than left to finish and report on code nobody has any more - but not on main. A cancelled
# run is the workflow's most recent conclusion there, and the badge draws that as failing, so
# cancelling on main turns a green history red for nothing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # The suite starts a MySQL container for the test JVM and runs four hundred-odd tests. Ten
    # minutes is the usual; this is the ceiling at which something has gone wrong rather than slow.
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # Keys off pom.xml, so a dependency change invalidates it and nothing else does.
          cache: maven

      # No service container for MySQL: AbstractMySqlIntegrationTest starts mysql:9.6.0 through
      # Testcontainers itself, which needs only the Docker daemon the GitHub-hosted runner already
      # has. Declaring one here as well would leave a second database running and used by nothing.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        # Especially on failure, which is when the reports are the only thing worth having.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
