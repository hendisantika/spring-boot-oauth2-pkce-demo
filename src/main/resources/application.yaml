server:
  port: 8080

spring:
  application:
    name: spring-boot-oauth2-pkce-demo

  datasource:
    url: jdbc:mysql://localhost:3312/oauth2_pkce_demo?preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: pkce
    password: pkce
    hikari:
      pool-name: oauth2-pkce-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

app:
  # Issuer of the authorization server. The client registration below points at
  # the same host, so this one app plays both roles. Endpoints are configured
  # explicitly rather than through issuer-uri discovery, because discovery would
  # require the server to already be listening while the context is still starting.
  issuer-uri: http://localhost:8080
  # Public client: no secret at all, so PKCE is the only thing binding the authorization
  # code to the caller. Spring Authorization Server will not issue it a refresh token.
  client:
    registration-id: pkce-demo-client
    client-id: pkce-demo-client
    client-name: PKCE Demo Client
    scopes:
      - openid
      - profile
      - email
  # Confidential client, still required to use PKCE. This one does get a refresh token,
  # which is what the /refresh page exercises.
  confidential-client:
    registration-id: pkce-confidential-client
    client-id: pkce-confidential-client
    client-secret: confidential-secret
    client-name: PKCE Confidential Client
    scopes:
      - openid
      - profile
      - email
  # Machine-to-machine client. It holds no secret at all: it authenticates by signing a
  # short-lived JWT with a private key the server only ever sees the public half of.
  assertion-client:
    registration-id: pkce-assertion-client
    client-id: pkce-assertion-client
    client-name: PKCE Assertion Client
    scopes:
      - api.read
  # Authenticates with a TLS client certificate instead of any credential in the request,
  # and receives a token bound to that certificate.
  mtls-client:
    registration-id: pkce-mtls-client
    client-id: pkce-mtls-client
    client-name: PKCE mTLS Client
    scopes:
      - api.read
  # A downstream service that trades a user's token for a narrower one of its own,
  # either impersonating the user or acting on their behalf.
  exchange-client:
    registration-id: pkce-exchange-client
    client-id: pkce-exchange-client
    client-secret: exchange-secret
    client-name: PKCE Exchange Client
    scopes:
      - api.read
      - api.write
  # Authenticates a user who never touches this app: it names them with a hint and waits for
  # them to approve on their own device.
  ciba-client:
    registration-id: pkce-ciba-client
    client-id: pkce-ciba-client
    client-secret: ciba-secret
    client-name: PKCE CIBA Client
    scopes:
      - api.read
  # Shaped to the FAPI 2.0 security profile: no shared secret, PKCE required, and tokens
  # bound to the client's certificate.
  fapi-client:
    registration-id: pkce-fapi-client
    client-id: pkce-fapi-client
    client-name: PKCE FAPI Client
    scopes:
      - openid
      - profile
  # Binds its authorization code to a DPoP key as well as to a PKCE verifier, so the code is
  # worthless to anyone who cannot sign with that key.
  code-binding-client:
    registration-id: pkce-code-binding-client
    client-id: pkce-code-binding-client
    client-name: PKCE Code Binding Client
    scopes:
      - openid
      - profile
  # The client's registration at the honest server, used by the mix-up demo. The attacker knows
  # this client id - client identifiers are not secrets - and that is all the attack needs.
  mix-up-client:
    registration-id: pkce-mixup-client
    client-id: pkce-mixup-client
    client-name: PKCE Mix-Up Client
    scopes:
      - openid
      - profile
  # Holds the initial access token that RFC 7591 section 3 talks about: the credential that lets
  # something register a new client. Its two scopes are used one at a time, never together.
  registrar-client:
    registration-id: pkce-registrar-client
    client-id: pkce-registrar-client
    client-secret: registrar-secret
    client-name: PKCE Registrar Client
    scopes:
      - client.create
      - client.read
  # A second service that can exchange tokens. Its registration is as trusted as the other one's;
  # what it does not have is the user's token naming it in may_act.
  relay-client:
    registration-id: pkce-relay-client
    client-id: pkce-relay-client
    client-secret: relay-secret
    client-name: PKCE Relay Client
    scopes:
      - api.read
  # The same certificate as the mTLS client, on a registration that is issued a refresh token -
  # which the client credentials grant never is. Registered separately so the mTLS page keeps
  # demonstrating one thing and this one another.
  mtls-refresh-client:
    registration-id: pkce-mtls-refresh-client
    client-id: pkce-mtls-refresh-client
    client-name: PKCE mTLS Refresh Client
    scopes:
      - profile
      - email
  # Its own registration so a freshness probe is one round trip: no consent screen in the way, and
  # a redirect URI nothing else is listening on.
  freshness-client:
    registration-id: pkce-freshness-client
    client-id: pkce-freshness-client
    client-name: PKCE Freshness Client
    scopes:
      - openid
      - profile
  # Consent stays on for this one: the prompt=none page is about the difference between a user who
  # has already said yes and one who has not.
  silent-client:
    registration-id: pkce-silent-client
    client-id: pkce-silent-client
    client-name: PKCE Silent Client
    scopes:
      - openid
      - profile
  # Confidential, because only a client that can authenticate may push a request. Consent is off so
  # that one pushed request is consumed by one round trip.
  request-uri-client:
    registration-id: pkce-request-uri-client
    client-id: pkce-request-uri-client
    client-secret: request-uri-secret
    client-name: PKCE Request URI Client
    scopes:
      - openid
      - profile
  # Confidential so it can push, consent off so a run is one round trip. The authorization_details
  # it asks for are the point; the consent screen showing them is the other RAR page's business.
  rar-client:
    registration-id: pkce-rar-client
    client-id: pkce-rar-client
    client-secret: rar-secret
    client-name: PKCE RAR Client
    scopes:
      - openid
      - profile
  # Public and PKCE, because DPoP is about the key rather than the client's credentials. Consent is
  # off so the probe can get a bound token in one round trip.
  dpop-nonce-client:
    registration-id: pkce-dpop-nonce-client
    client-id: pkce-dpop-nonce-client
    client-name: PKCE DPoP Nonce Client
    scopes:
      - openid
      - profile
  # Public and PKCE, consent off: the page is about how the answer is delivered, not about who is
  # asking or what they are agreeing to.
  jarm-client:
    registration-id: pkce-jarm-client
    client-id: pkce-jarm-client
    client-name: PKCE JARM Client
    scopes:
      - openid
      - profile
  # Registered for ES256 authorization responses, so the same page can show two algorithms.
  jarm-ec-client:
    registration-id: pkce-jarm-ec-client
    client-id: pkce-jarm-ec-client
    client-name: PKCE JARM ES256 Client
    scopes:
      - openid
      - profile
  # Registered for none, which JARM forbids - the page exists to show what happens.
  jarm-none-client:
    registration-id: pkce-jarm-none-client
    client-id: pkce-jarm-none-client
    client-name: PKCE JARM Unsigned Client
    scopes:
      - openid
      - profile
  # Signed and then encrypted to a key the client publishes, which is the other half of JARM.
  jarm-encrypted-client:
    registration-id: pkce-jarm-encrypted-client
    client-id: pkce-jarm-encrypted-client
    client-name: PKCE JARM Encrypted Client
    scopes:
      - openid
      - profile
  # The same encryption with a different content cipher, so the two shapes can be compared.
  jarm-gcm-client:
    registration-id: pkce-jarm-gcm-client
    client-id: pkce-jarm-gcm-client
    client-name: PKCE JARM GCM Client
    scopes:
      - openid
      - profile
  # A real JWA method this server does not offer, to show what a registration it cannot meet does.
  jarm-unsupported-enc-client:
    registration-id: pkce-jarm-unsupported-enc-client
    client-id: pkce-jarm-unsupported-enc-client
    client-name: PKCE JARM Unsupported Enc Client
    scopes:
      - openid
      - profile
  # Registered to sign its request objects with PS256, which is what FAPI asks for.
  jar-ps-client:
    registration-id: pkce-jar-ps-client
    client-id: pkce-jar-ps-client
    client-name: PKCE JAR PS256 Client
    scopes:
      - openid
      - profile
  # Registered to encrypt its request objects with RSA-OAEP-512 rather than the server's default.
  jar-oaep512-client:
    registration-id: pkce-jar-oaep512-client
    client-id: pkce-jar-oaep512-client
    client-name: PKCE JAR RSA-OAEP-512 Client
    scopes:
      - openid
      - profile
  # Registered for RSA1_5, which is a real JWA algorithm this server does not offer.
  jar-rsa15-client:
    registration-id: pkce-jar-rsa15-client
    client-id: pkce-jar-rsa15-client
    client-name: PKCE JAR RSA1_5 Client
    scopes:
      - openid
      - profile
  # Registered to encrypt the request object's content with A256GCM rather than the default.
  jar-gcm-client:
    registration-id: pkce-jar-gcm-client
    client-id: pkce-jar-gcm-client
    client-name: PKCE JAR A256GCM Client
    scopes:
      - openid
      - profile
  # Registered for A192CBC-HS384, which is a real JWA method this server does not offer.
  jar-unsupported-enc-client:
    registration-id: pkce-jar-unsupported-enc-client
    client-id: pkce-jar-unsupported-enc-client
    client-name: PKCE JAR Unsupported enc Client
    scopes:
      - openid
      - profile
  # Registered with an enc and no alg, which the registration spec does not allow.
  jar-enc-only-client:
    registration-id: pkce-jar-enc-only-client
    client-id: pkce-jar-enc-only-client
    client-name: PKCE JAR enc-without-alg Client
    scopes:
      - openid
      - profile
  # Registered with request_object_signing_alg: none, which the registration spec permits.
  jar-none-client:
    registration-id: pkce-jar-none-client
    client-id: pkce-jar-none-client
    client-name: PKCE JAR Unsigned Client
    scopes:
      - openid
      - profile
  # The same registration, with RFC 9101 section 10.5's downgrade defence turned on beside it.
  jar-none-strict-client:
    registration-id: pkce-jar-none-strict-client
    client-id: pkce-jar-none-strict-client
    client-name: PKCE JAR Unsigned, Required Signed Client
    scopes:
      - openid
      - profile
  # RFC 9126 section 6: the only way this client may start an authorization request is PAR.
  par-required-client:
    registration-id: pkce-par-required-client
    client-id: pkce-par-required-client
    client-secret: par-required-secret
    client-name: PKCE PAR-required Client
    scopes:
      - openid
      - profile
  # Hosts its request objects and registers the URLs, per OpenID Connect Registration's request_uris.
  fetched-request-client:
    registration-id: pkce-fetched-request-client
    client-id: pkce-fetched-request-client
    client-secret: fetched-request-secret
    client-name: PKCE Hosted Request Object Client
    scopes:
      - openid
      - profile
  demo-users:
    - username: hendi
      password: password
      full-name: Hendi Santika
      email: hendisantika@gmail.com
      authorities:
        - ROLE_ADMIN
        - ROLE_USER
    - username: itadmin
      password: password
      full-name: IT Administrator
      email: itadmin@example.com
      authorities:
        - ROLE_USER

logging:
  level:
    org.springframework.security: INFO
    id.my.hendisantika.oauth2pkcedemo: DEBUG
