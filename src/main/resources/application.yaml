server:
  port: 8080

spring:
  application:
    name: spring-boot-oauth2-pkce-demo

  datasource:
    url: jdbc:mysql://localhost:3312/oauth2_pkce_demo?preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: pkce
    password: pkce
    hikari:
      pool-name: oauth2-pkce-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

app:
  # Issuer of the authorization server. The client registration below points at
  # the same host, so this one app plays both roles. Endpoints are configured
  # explicitly rather than through issuer-uri discovery, because discovery would
  # require the server to already be listening while the context is still starting.
  issuer-uri: http://localhost:8080
  # Public client: no secret at all, so PKCE is the only thing binding the authorization
  # code to the caller. Spring Authorization Server will not issue it a refresh token.
  client:
    registration-id: pkce-demo-client
    client-id: pkce-demo-client
    client-name: PKCE Demo Client
    scopes:
      - openid
      - profile
      - email
  # Confidential client, still required to use PKCE. This one does get a refresh token,
  # which is what the /refresh page exercises.
  confidential-client:
    registration-id: pkce-confidential-client
    client-id: pkce-confidential-client
    client-secret: confidential-secret
    client-name: PKCE Confidential Client
    scopes:
      - openid
      - profile
      - email
  # Machine-to-machine client. It holds no secret at all: it authenticates by signing a
  # short-lived JWT with a private key the server only ever sees the public half of.
  assertion-client:
    registration-id: pkce-assertion-client
    client-id: pkce-assertion-client
    client-name: PKCE Assertion Client
    scopes:
      - api.read
  # Authenticates with a TLS client certificate instead of any credential in the request,
  # and receives a token bound to that certificate.
  mtls-client:
    registration-id: pkce-mtls-client
    client-id: pkce-mtls-client
    client-name: PKCE mTLS Client
    scopes:
      - api.read
  # A downstream service that trades a user's token for a narrower one of its own,
  # either impersonating the user or acting on their behalf.
  exchange-client:
    registration-id: pkce-exchange-client
    client-id: pkce-exchange-client
    client-secret: exchange-secret
    client-name: PKCE Exchange Client
    scopes:
      - api.read
      - api.write
  # Authenticates a user who never touches this app: it names them with a hint and waits for
  # them to approve on their own device.
  ciba-client:
    registration-id: pkce-ciba-client
    client-id: pkce-ciba-client
    client-secret: ciba-secret
    client-name: PKCE CIBA Client
    scopes:
      - api.read
  # Shaped to the FAPI 2.0 security profile: no shared secret, PKCE required, and tokens
  # bound to the client's certificate.
  fapi-client:
    registration-id: pkce-fapi-client
    client-id: pkce-fapi-client
    client-name: PKCE FAPI Client
    scopes:
      - openid
      - profile
  # Binds its authorization code to a DPoP key as well as to a PKCE verifier, so the code is
  # worthless to anyone who cannot sign with that key.
  code-binding-client:
    registration-id: pkce-code-binding-client
    client-id: pkce-code-binding-client
    client-name: PKCE Code Binding Client
    scopes:
      - openid
      - profile
  # The client's registration at the honest server, used by the mix-up demo. The attacker knows
  # this client id - client identifiers are not secrets - and that is all the attack needs.
  mix-up-client:
    registration-id: pkce-mixup-client
    client-id: pkce-mixup-client
    client-name: PKCE Mix-Up Client
    scopes:
      - openid
      - profile
  # Holds the initial access token that RFC 7591 section 3 talks about: the credential that lets
  # something register a new client. Its two scopes are used one at a time, never together.
  registrar-client:
    registration-id: pkce-registrar-client
    client-id: pkce-registrar-client
    client-secret: registrar-secret
    client-name: PKCE Registrar Client
    scopes:
      - client.create
      - client.read
  # A second service that can exchange tokens. Its registration is as trusted as the other one's;
  # what it does not have is the user's token naming it in may_act.
  relay-client:
    registration-id: pkce-relay-client
    client-id: pkce-relay-client
    client-secret: relay-secret
    client-name: PKCE Relay Client
    scopes:
      - api.read
  # The same certificate as the mTLS client, on a registration that is issued a refresh token -
  # which the client credentials grant never is. Registered separately so the mTLS page keeps
  # demonstrating one thing and this one another.
  mtls-refresh-client:
    registration-id: pkce-mtls-refresh-client
    client-id: pkce-mtls-refresh-client
    client-name: PKCE mTLS Refresh Client
    scopes:
      - profile
      - email
  demo-users:
    - username: hendi
      password: password
      full-name: Hendi Santika
      email: hendisantika@gmail.com
      authorities:
        - ROLE_ADMIN
        - ROLE_USER
    - username: itadmin
      password: password
      full-name: IT Administrator
      email: itadmin@example.com
      authorities:
        - ROLE_USER

logging:
  level:
    org.springframework.security: INFO
    id.my.hendisantika.oauth2pkcedemo: DEBUG
